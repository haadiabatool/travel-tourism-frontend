<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planned Trips | NatureNest</title>

</head>

<body class="bg-gray-50 min-h-screen">

    <header class="bg-white border-b border-gray-100">

        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">

            <div>

                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 ">
                    ✈️ Planned Trips
                </h1>

                <p class="text-gray-500 mt-1">
                    Your upcoming nature adventures
                </p>

            </div>


            <div class="flex flex-row justify-end gap-3">
   
                <button id="addTripBtn" type="button"
                class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold">
                + Add New Trip
                </button>

                <button onclick="window.location.href='index.html'" class="px-6 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold ">
                ← Back
                </button>

            </div>
            
        </div>

    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <div id="plannedTripsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>


        <div id="emptyPlannedTrips" class="hidden text-center py-20">

            <div class="text-6xl mb-5">
                ✈️
            </div>

            <h2 class=" text-2xl font-bold text-gray-800 mb-2">
                No Planned Trips
            </h2>

            <p class="text-gray-500">
                Plan a destination and it will appear here.
            </p>

        </div>

    </main>

    <section id="addTripModal" class="fixed inset-0 bg-black/50 hidden backdrop-blur-sm items-center justify-center p-4 z-10 overflow-y-auto">

        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl my-8">
            <div class="flex items-center justify-between border-b pb-4 mb-4">

                <h3 class="text-xl font-bold text-gray-800">
                    ✨ Add New Trip
                </h3>

                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 font-bold text-xl">
                    &times;
                </button>

            </div>

            <!-- FORM -->
        <form id="addTripForm" class="space-y-5">

            <!-- TRIP NAME -->
            <div>

                <label for="newTripName" class="block text-sm font-semibold text-gray-700 mb-2">
                    Trip Name
                </label>

                <input id="newTripName" type="text" placeholder="e.g. Hunza Adventure"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">

                <p id="newTripNameError" class="hidden text-sm text-red-500 mt-1">
                </p>

            </div>

            <!-- DESTINATION -->
            <div>

                <label for="newTripDestination" class="block text-sm font-semibold text-gray-700 mb-2">
                    Select Destination
                </label>

                <select id="newTripDestination"class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">

                    <option value="select a destination">
                        Select a destination
                    </option>

                </select>

                <p id="newDestinationError" class="hidden text-sm text-red-500 mt-1">
                </p>

            </div>

            <!-- DATES -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div>

                    <label for="newStartDate" class="block text-sm font-semibold text-gray-700 mb-2">
                        Start Date
                    </label>

                    <input id="newStartDate" type="date" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">

                    <p id="newStartDateError" class="hidden text-sm text-red-500 mt-1">
                    </p>

                </div>

                <div>

                    <label for="newEndDate" class="block text-sm font-semibold text-gray-700 mb-2">
                        End Date
                    </label>

                    <input id="newEndDate" type="date" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">

                    <p id="newEndDateError" class="hidden text-sm text-red-500 mt-1"></p>

                </div>

            </div>

            <!-- TRAVELERS -->
            <div>

                <label for="newTravelers" class="block text-sm font-semibold text-gray-700 mb-2">
                    Number of Travelers
                </label>

                <input
                    id="newTravelers" type="number" min="1" max="50" placeholder="e.g. 2" 
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500">

                <p id="newTravelersError"
                    class="hidden text-sm text-red-500 mt-1">
                </p>

            </div>

            <!-- DESCRIPTION -->
            <div>

                <label for="newTripDescription" class="block text-sm font-semibold text-gray-700 mb-2">
                    Trip Description
                </label>

                <textarea id="newTripDescription" rows="4" placeholder="Tell us something about your trip..."
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none resize-none focus:ring-2 focus:ring-emerald-500"></textarea>

                <p id="newDescriptionError" class="hidden text-sm text-red-500 mt-1">
                </p>

            </div>

            <!-- BUTTONS -->
            <div class="flex gap-3 pt-3">

                <button id="cancelAddTripBtn" type="button"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold">
                    Cancel
                </button>


                <button type="submit"
                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold">
                    Create Trip
                </button>

            </div>

        </form>

        </div>

    </section>


    <script type="module" src="/src/planned-trips.js"></script>

</body>

</html>
