<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Planned Trips | NatureNest</title>


</head>

<body class="bg-gray-50 min-h-screen">


<header class="bg-white border-b border-gray-100">

    <div
        class="
            max-w-7xl
            mx-auto
            px-6
            py-5
            flex
            items-center
            justify-between
        "
    >

        <div>

            <h1
                class="
                    text-2xl
                    md:text-3xl
                    font-bold
                    text-gray-800
                "
            >
                ✈️ Planned Trips
            </h1>

            <p class="text-gray-500 mt-1">
                Your upcoming nature adventures
            </p>

        </div>


        <button
            onclick="history.back()"
            class="
                px-5
                py-2.5
                rounded-xl
                bg-gray-100
                hover:bg-gray-200
                text-gray-700
                font-semibold
            "
        >
            ← Back
        </button>

    </div>

</header>


<main
    class="
        max-w-7xl
        mx-auto
        px-6
        py-8
    "
>

    <div
        id="plannedTripsGrid"
        class="
            grid
            grid-cols-1
            sm:grid-cols-2
            lg:grid-cols-3
            xl:grid-cols-4
            gap-6
        "
    >
    </div>


    <div
        id="emptyPlannedTrips"
        class="hidden text-center py-20"
    >

        <div class="text-6xl mb-5">
            ✈️
        </div>

        <h2
            class="
                text-2xl
                font-bold
                text-gray-800
                mb-2
            "
        >
            No Planned Trips
        </h2>

        <p class="text-gray-500">
            Plan a destination and it will appear here.
        </p>

    </div>

</main>


<script
    type="module"
    src="/src/planned-trips.js"
></script>

</body>

</html>
