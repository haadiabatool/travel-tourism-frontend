<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Saved Destinations | NatureNest</title>


    <!-- Optional Tailwind Configuration -->

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        nature: {
                            50: "#ecfdf5",
                            100: "#d1fae5",
                            500: "#10b981",
                            600: "#059669",
                            700: "#047857"
                        }

                    }

                }

            }

        };

    </script>

</head>


<body
    class="
        min-h-screen
        bg-gray-50
        text-gray-800
    "
>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header
        class="
            bg-white
            border-b
            border-gray-100
            sticky
            top-0
            z-40
        "
    >

        <div
            class="
                max-w-7xl
                mx-auto
                px-5
                sm:px-6
                lg:px-8
                py-5
                flex
                items-center
                justify-between
                gap-4
            "
        >

            <!-- TITLE -->

            <div>

                <div
                    class="
                        flex
                        items-center
                        gap-3
                    "
                >

                    <div
                        class="
                            w-11
                            h-11
                            rounded-xl
                            bg-blue-50
                            flex
                            items-center
                            justify-center
                            text-xl
                        "
                    >
                        🔖
                    </div>


                    <div>

                        <h1
                            class="
                                text-2xl
                                md:text-3xl
                                font-bold
                                text-gray-800
                            "
                        >
                            Saved Destinations
                        </h1>


                        <p
                            class="
                                text-sm
                                text-gray-500
                                mt-1
                                hidden
                                sm:block
                            "
                        >
                            Places you saved for later
                        </p>

                    </div>

                </div>

            </div>


            <!-- BACK BUTTON -->

            <button
                type="button"
                onclick="history.back()"
                class="
                    flex
                    items-center
                    gap-2
                    px-4
                    sm:px-5
                    py-2.5
                    rounded-xl
                    bg-gray-100
                    hover:bg-gray-200
                    text-gray-700
                    font-semibold
                    text-sm
                    transition
                    whitespace-nowrap
                "
            >

                <span>
                    ←
                </span>

                <span class="hidden sm:inline">
                    Back
                </span>

            </button>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main
        class="
            max-w-7xl
            mx-auto
            px-5
            sm:px-6
            lg:px-8
            py-8
        "
    >


        <!-- ==================================================
             TOP INFO
        ================================================== -->

        <div
            class="
                flex
                items-center
                justify-between
                mb-7
                gap-4
            "
        >

            <div>

                <h2
                    class="
                        text-lg
                        sm:text-xl
                        font-bold
                        text-gray-800
                    "
                >
                    Your Saved Places
                </h2>

                <p
                    class="
                        text-sm
                        text-gray-500
                        mt-1
                    "
                >
                    Explore the destinations you've bookmarked.
                </p>

            </div>


            <!-- COUNT -->

            <div
                class="
                    bg-blue-50
                    text-black
                    px-4
                    py-2
                    rounded-xl
                    text-sm
                    font-bold
                    whitespace-nowrap
                "
            >

                <span id="savedCount">
                    0
                </span>

                <span>
                    Saved
                </span>

            </div>

        </div>



        <!-- ==================================================
             SAVED DESTINATIONS GRID
        ================================================== -->

        <div
            id="savedGrid"
            class="
                grid
                grid-cols-1
                sm:grid-cols-2
                lg:grid-cols-3
                xl:grid-cols-4
                gap-6
            "
        >

            <!-- Cards generated by saved.js -->

        </div>



        <!-- ==================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="emptySaved"
            class="
                hidden
                text-center
                py-20
                px-5
            "
        >

            <div
                class="
                    w-20
                    h-20
                    mx-auto
                    rounded-full
                    bg-blue-50
                    flex
                    items-center
                    justify-center
                    text-4xl
                    mb-6
                "
            >
                🔖
            </div>


            <h2
                class="
                    text-2xl
                    font-bold
                    text-gray-800
                    mb-2
                "
            >
                No Saved Destinations
            </h2>


            <p
                class="
                    max-w-md
                    mx-auto
                    text-gray-500
                    leading-relaxed
                "
            >
                You haven't saved any destinations yet.
                Explore NatureNest and bookmark places
                you want to visit later.
            </p>


            <button
                type="button"
                onclick="
                    window.location.href='explore.html'
                "
                class="
                    mt-6
                    px-6
                    py-3
                    rounded-xl
                    bg-blue-600
                    hover:bg-blue-700
                    text-white
                    font-semibold
                    transition
                "
            >
                Explore Destinations
            </button>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="/src/saved.js"
    ></script>

</body>

</html>
