<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trip Details | NatureNest</title>

</head>


<body class="
        bg-gray-50
        min-h-screen
    ">


    <!-- HEADER -->

    <header class="
            bg-white
            border-b
            border-gray-100
        ">

        <div class="
                max-w-6xl
                mx-auto
                px-6
                py-5
                flex
                items-center
                justify-between
                gap-4
            ">

            <div>

                <p class="
                        text-sm
                        font-semibold
                        text-emerald-600
                    ">
                    ✈️ NatureNest
                </p>

                <h1 id="tripTitle" class="
                        text-2xl
                        md:text-3xl
                        font-bold
                        text-gray-800
                    ">
                    Trip Details
                </h1>

            </div>


            <button onclick="goBack()" class="
                    px-5
                    py-2.5
                    rounded-xl
                    bg-gray-100
                    hover:bg-gray-200
                    text-gray-700
                    font-semibold
                ">
                ← Back
            </button>

        </div>

    </header>



    <!-- MAIN -->

    <main class="
            max-w-6xl
            mx-auto
            px-6
            py-8
        ">


        <!-- TRIP SUMMARY -->

        <section class="
                bg-white
                rounded-3xl
                shadow-sm
                border
                border-gray-100
                p-6
                md:p-8
                mb-8
            ">

            <div class="
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    md:justify-between
                    gap-5
                    mb-8
                ">

                <div>

                    <p class="
                            text-sm
                            uppercase
                            tracking-wide
                            font-semibold
                            text-emerald-600
                        ">
                        Your Planned Journey
                    </p>

                    <h2 id="summaryTripName" class="
                            text-3xl
                            md:text-4xl
                            font-bold
                            text-gray-800
                            mt-1
                        ">
                    </h2>

                    <p id="summaryDescription" class="
                            text-gray-500
                            mt-2
                        ">
                    </p>

                </div>


                <!-- EDIT BUTTON -->
                <div id="editTripSection">

                    <button id="editTripBtn" type="button" class="
                        bg-emerald-600
                        hover:bg-emerald-700
                        text-white
                        px-6
                        py-3
                        rounded-xl
                        font-semibold
                        transition
                        justify-end
                    ">
                        ✏️ Edit Trip
                    </button>


                    <!-- ========================================== -->
                    <!-- EDIT TRIP FORM -->
                    <!-- ========================================== -->



                </div>

            </div>





            <!-- SUMMARY CARDS -->

            <div class="
                    grid
                    grid-cols-1
                    sm:grid-cols-2
                    lg:grid-cols-4
                    gap-4
                ">


                <!-- DESTINATION -->

                <div class="
                        bg-emerald-50
                        rounded-2xl
                        p-5
                    ">

                    <p class="
                            text-sm
                            text-gray-500
                            mb-2
                        ">
                        📍 Destination
                    </p>

                    <h3 id="summaryDestination" class="
                            text-lg
                            font-bold
                            text-gray-800
                        ">
                    </h3>

                </div>



                <!-- TOTAL DAYS -->

                <div class="
                        bg-blue-50
                        rounded-2xl
                        p-5
                    ">

                    <p class="
                            text-sm
                            text-gray-500
                            mb-2
                        ">
                        📅 Total Days
                    </p>

                    <h3 id="summaryDays" class="
                            text-lg
                            font-bold
                            text-gray-800
                        ">
                    </h3>

                </div>



                <!-- ACTIVITIES -->

                <div class="
                        bg-purple-50
                        rounded-2xl
                        p-5
                    ">

                    <p class="
                            text-sm
                            text-gray-500
                            mb-2
                        ">
                        🗓️ Total Activities
                    </p>

                    <h3 id="summaryActivities" class="
                            text-lg
                            font-bold
                            text-gray-800
                        ">
                    </h3>

                </div>



                <!-- TRAVELERS -->

                <div class="
                        bg-orange-50
                        rounded-2xl
                        p-5
                    ">

                    <p class="
                            text-sm
                            text-gray-500
                            mb-2
                        ">
                        👥 Travelers
                    </p>

                    <h3 id="summaryTravelers" class="
                            text-lg
                            font-bold
                            text-gray-800
                        ">
                    </h3>

                </div>

            </div>


            <!-- DATES -->

            <div class="
                    mt-6
                    flex
                    flex-wrap
                    gap-4
                    text-sm
                    text-gray-600
                ">

                <span class="
                        bg-gray-100
                        px-4
                        py-2
                        rounded-full
                    ">
                    📅 Start:
                    <strong id="summaryStartDate"></strong>
                </span>

                <span class="
                        bg-gray-100
                        px-4
                        py-2
                        rounded-full
                    ">
                    📅 End:
                    <strong id="summaryEndDate"></strong>
                </span>

            </div>

        </section>



        <!-- COMPLETE ITINERARY -->

        <section>

            <div class="
                    mb-6
                ">

                <p class="
                        text-sm
                        font-semibold
                        text-emerald-600
                        uppercase
                        tracking-wide
                    ">
                    Your Journey
                </p>

                <h2 class="
                        text-3xl
                        font-bold
                        text-gray-800
                    ">
                    Complete Itinerary
                </h2>

            </div>


            <div id="completeItinerary" class="
                    space-y-6
                ">
            </div>

        </section>

    </main>



    <script type="module" src="/src/trip-details.js"></script>

</body>

</html>
