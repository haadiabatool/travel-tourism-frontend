<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destination Details</title>
</head>

<body class="bg-linear-to-br from-emerald-50 via-white to-emerald-100 min-h-screen">

    <!-- Main Section -->
    <!-- Main Section -->
<section class="min-h-screen bg-gray-100 py-8">

    <div class="max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- TOP IMAGE -->
        <div class="relative w-full h-75 md:h-112.5 lg:h-137.5 overflow-hidden">

            <img
                id="destinationImage"
                src=""
                alt=""
                class="w-full h-full object-cover transition-transform duration-700 hover:scale-105">

            <div class="absolute inset-0 bg-linear-to-t from-black/60 via-black/20 to-transparent"></div>

            <div class="absolute top-8 left-8">
                <h2
                    id="imageTitle"
                    class="text-white text-3xl md:text-4xl lg:text-5xl font-bold drop-shadow-lg">
                </h2>
            </div>

    <div class="absolute top-7 right-5 flex items-center gap-2">

    <!-- FAVORITE -->
    <button
        id="favoriteBtn"
        type="button"
        aria-label="Add to favorites"
        title="Add to Favorites"
        class="favorite-btn w-10 h-10 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm text-rose-500 shadow-md hover:bg-rose-500 hover:text-white transition-all duration-300 active:scale-90">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/>
        </svg>
    </button>


    <!-- PLAN TRIP -->
    <button
        id="planBtn"
        type="button"
        aria-label="Add to planned trips"
        title="Plan this Trip"
        class="plan-btn w-10 h-10 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm text-emerald-600 shadow-md hover:bg-emerald-600 hover:text-white transition-all duration-300 active:scale-90">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.5 19.5 21 12 2.5 4.5l-2.5 7.5 2.5 7.5Z"/>

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 12h16"/>
        </svg>
    </button>


    <!-- SAVE DESTINATION -->
    <button
        id="saveBtn"
        type="button"
        aria-label="Save destination"
        title="Save Destination"
        class="save-btn w-10 h-10 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm text-blue-600 shadow-md hover:bg-blue-600 hover:text-white transition-all duration-300 active:scale-90">

        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 5.5A2.5 2.5 0 0 1 7.5 3h9A2.5 2.5 0 0 1 19 5.5v15a1 1 0 0 1-1.6.8L12 17.5l-5.4 3.8A1 1 0 0 1 5 20.5v-15Z"/>
        </svg>
    </button>

</div>
        </div>
        <!-- CONTENT -->
        <div class="px-6 py-10 md:px-10 lg:px-14">

            <!-- Destination Name -->
            <div class="flex flex-wrap items-center gap-5">

                <h1
                    id="destinationName"
                    class="text-4xl lg:text-5xl font-bold text-gray-800">
                </h1>

                <div class="mt-2">
                    <span
                        id="destinationCategory"
                        class="inline-block bg-emerald-100 text-emerald-700 px-3 py-2 rounded-full text-sm font-semibold">
                    </span>
                </div>

            </div>

            <!-- Location -->
            <div class="mt-3 flex items-center gap-2">

                <span class="text-emerald-700 text-lg">
                    📍
                </span>

                <span
                    id="destinationLocation"
                    class="text-gray-600 font-medium">
                </span>

            </div>

            <!-- Description -->
            <div class="mt-8">

                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    Destination Story
                </h2>

                <p
                    id="destinationDescription"
                    class="text-gray-600 leading-8">
                </p>

            </div>

            <!-- Highlights -->
            <div class="mt-8">

                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    Highlights
                </h2>

                <ul
                    id="highlights"
                    class="space-y-3 text-gray-600">
                </ul>

            </div>

            <!-- Travel Information -->
            <div class="mt-10">

                <h2 class="text-2xl font-bold text-gray-800 mb-5">
                    Basic Travel Information
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                    <div class="bg-emerald-50 rounded-2xl p-5">

                        <p class="text-sm text-gray-500">
                            Best Time
                        </p>

                        <h3
                            id="bestTime"
                            class="text-lg font-semibold text-gray-800 mt-2">
                        </h3>

                    </div>

                    <div class="bg-emerald-50 rounded-2xl p-5">

                        <p class="text-sm text-gray-500">
                            Entry Fee
                        </p>

                        <h3
                            id="entryFee"
                            class="text-lg font-semibold text-gray-800 mt-2">
                        </h3>

                    </div>

                    <div class="bg-emerald-50 rounded-2xl p-5">

                        <p class="text-sm text-gray-500">
                            Duration
                        </p>

                        <h3
                            id="duration"
                            class="text-lg font-semibold text-gray-800 mt-2">
                        </h3>

                    </div>

                    <div class="bg-emerald-50 rounded-2xl p-5">

                        <p class="text-sm text-gray-500">
                            Weather
                        </p>

                        <h3
                            id="weather"
                            class="text-lg font-semibold text-gray-800 mt-2">
                        </h3>

                    </div>

                </div>

            </div>

            <!-- CTA -->
            <div class="mt-10 flex flex-wrap gap-5">

                <button
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-4 rounded-full transition hover:scale-105 shadow-lg flex items-center gap-3">

                    Book Your Trip

                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M17 8l4 4m0 0l-4 4m4-4H3"/>

                    </svg>

                </button>

                <button
                    class="text-emerald-600 hover:bg-emerald-100 bg-emerald-50 px-10 py-4 rounded-full transition hover:scale-105 shadow-lg">

                    <a href="index.html">
                        ← Back to Homepage
                    </a>

                </button>

            </div>

        </div>

    </div>

</section>

    <!-- JS -->
     <script type="module" src="/src/main.js"></script>
     <script type="module" src="/src/dynamic-destination.js"></script>
</body>
</html>
